<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Коммерческое предложение — Вэбтех</title>
<link rel="stylesheet" href="lib/webtech.css">
<style>body{margin:0;background:var(--brand-50);font-family:var(--font-sans)}#root{max-width:1600px;margin:0 auto;padding:32px 16px}
.bar{max-width:1600px;margin:0 auto;padding:24px 16px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;font:600 16px/24px var(--font-sans);color:var(--ink-secondary)}
.bar button{font:700 16px/24px var(--font-sans);padding:10px 20px;border:0;border-radius:999px;background:var(--brand-strong);color:#fff;cursor:pointer}
@media print{.bar{display:none}#root{padding:0;max-width:none}}</style>
</head>
<body>
<div class="bar wt-no-print"><span>Коммерческое предложение · 12 слайдов · шаблон, ДС 1.19.0</span><button onclick="print()">Сохранить в PDF</button></div>
<div id="root"></div>
<script src="lib/react.production.min.js"></script>
<script src="lib/react-dom.production.min.js"></script>
<script src="lib/webtech.js"></script>
<script>
var W = window.Webtech, h = React.createElement;

const slides = [
  /* @__PURE__ */ h(TitleSlide, { composition: "hero", textures: ["circuit"], overline: "Коммерческое предложение", title: "Цифровой кредитный конвейер для Банка «Пример»", subtitle: "Решение ВЭБ Технологии", author: "Илья Петров, коммерческий директор", date: "Сентябрь 2026" }),
  /* @__PURE__ */ h(TwoColumnSlide, { overline: "Задача", title: "Банк теряет клиентов: кредит выдаётся слишком долго", left: { icon: "triangle-alert", title: "Сейчас", bullets: ["Решение по заявке — до 3 дней", "40% заявок обрабатывается вручную", "Данные в трёх несвязанных системах"], marker: "dot" }, right: { icon: "target", title: "Цель банка", tint: true, bullets: ["Решение за 2 часа", "Автоматизация 80% заявок", "Единый профиль клиента"], marker: "check" }, section: "Коммерческое предложение" }),

  /* @__PURE__ */ h(CaseSlide, { title: "Банк: решение за 2 часа вместо 3 дней", client: "Банк из топ-10 Беларуси, 1,2 млн клиентов", problem: "Ручная обработка заявок и отток клиентов к конкурентам.", solution: ["Кредитный конвейер", "Автоматический скоринг", "Интеграция с Кредитным регистром"], results: [{ value: "2 часа", label: "на решение" }, { value: "+38%", label: "онлайн-одобрений" }], section: "Коммерческое предложение" }),
  /* @__PURE__ */ h(TableSlide, { overline: "Варианты", title: "Рекомендуем тариф «Бизнес»", table: /* @__PURE__ */ h(ComparisonTable, { options: ["Базовый", "Бизнес", "Корпоративный"], highlight: 1, features: [{ name: "Стоимость, тыс. BYN/год", values: ["200", "370", "от 600"] }, { name: "Заявок в месяц", values: ["до 20 тыс.", "до 100 тыс.", "без ограничений"] }, { name: "SLA", values: ["99,5%", "99,9%", "99,95%"] }, { name: "Выделенная команда", values: [false, true, true] }, { name: "Размещение в контуре банка", values: [false, false, true] }] }), note: "Цены без НДС, лицензия и поддержка включены", section: "Коммерческое предложение" }),
  /* @__PURE__ */ h(TeamSlide, { overline: "Команда", title: "Проект ведёт команда с опытом 30+ внедрений в банках", people: [{ name: "Мария Козлова", role: "Руководитель проекта", text: "30+ внедрений в банках", photo: W.samplePhoto("Мария Козлова") }, { name: "Илья Петров", role: "Аккаунт-менеджер", text: "Точка входа по всем вопросам", photo: W.samplePhoto("Илья Петров") }, { name: "Анна Смирнова", role: "Бизнес-аналитик", text: "Кредитные процессы", photo: W.samplePhoto("Анна Смирнова") }, { name: "Алексей Орлов", role: "Архитектор", text: "Интеграции с АБС", photo: W.samplePhoto("Алексей Орлов") }], section: "Коммерческое предложение" }),
  /* @__PURE__ */ h(
    GridSlide,
    {
      overline: "Почему мы",
      title: "Банки выбирают Вэбтех за опыт, фиксированные сроки и поддержку 24/7",
      layout: "bottom-3",
      section: "Коммерческое предложение",

        /* @__PURE__ */ h(Card, { icon: "building", overline: "Опыт", title: "40 банковских проектов" }, /* @__PURE__ */ h(BulletList, { size: "sm", items: ["Кредитные конвейеры", "Дистанционное обслуживание", "Интеграция с Кредитным регистром"] })),

];

</body>
</html>
